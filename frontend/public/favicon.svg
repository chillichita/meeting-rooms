<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <!-- solid backdrop disc: keeps the mark visible on both light and dark tab bars,
       since the logo's strokes alone (white) would vanish on a white tab background -->
  <circle cx="26" cy="26" r="26" fill="#07070C"/>
  <!-- same geometry as the app's nav logo — orbit ring + swoosh, just re-centered
       to leave a small margin inside the backdrop disc -->
  <circle cx="26" cy="26" r="19" fill="none" stroke="#F1EFEC" stroke-width="2.4"/>
  <path d="M26 26 Q 16.5 19 14.6 8.5" stroke="#E0631A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
